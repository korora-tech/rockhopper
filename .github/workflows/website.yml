name: Website

on:
  push:
    branches: [main]
    paths:
      - website/**
      - README.md
      - .github/workflows/website.yml
  pull_request:
    branches: [main]
    paths:
      - website/**
      - README.md
      - .github/workflows/website.yml
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The docs page is built from README.md, so a README change deploys too.
      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx --yes cf@1.0.0-beta.26 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDLFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 0aeb879de8e3cdde5fb3d413025222ce
