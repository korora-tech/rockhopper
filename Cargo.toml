[package]
name = "rockhopper"
version = "0.1.0"
edition = "2024"
description = "Rockhopper: a native GPUI launcher for Wayland"
license = "Apache-2.0"
repository = "https://github.com/korora-tech/rockhopper"
# The oldest Rust its dependencies build with (oo7).
rust-version = "1.92"

[dependencies]
gpui-kit = "=0.8.0"
nucleo-matcher = "0.3"
emojis = "0.9"
# Emoji are drawn from the colour font's own PNGs: GPUI cannot use an emoji
# font as a primary font, and its fallback prefers black-and-white glyphs.
fontdb = "0.23"
rustybuzz = "0.20"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
freedesktop-icons = "0.4"
libc = "0.2" # setsid for launched apps
# GPUI names Wayland outputs by a v5 UUID of their name.
uuid = { version = "1", features = ["v5"] }
# Clipboard history: watched and set through wlr data-control.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Encrypted at rest; the key lives only in the Secret Service keyring.
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.3"
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
wry = "0.57.1"
tao = "0.37.2"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
gtk = "0.18"

[profile.release]
lto = "thin"
codegen-units = 1
