[package]
name = "rockhopper"
version = "0.1.0"
edition = "2024"
description = "Rockhopper: a native GPUI launcher for Wayland"
license = "Apache-2.0"

[dependencies]
gpui-kit = "=0.8.0"
nucleo-matcher = "0.3"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2"
freedesktop-icons = "0.4"
libc = "0.2" # setsid for launched apps
# GPUI names Wayland outputs by a v5 UUID of their name.
uuid = { version = "1", features = ["v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
